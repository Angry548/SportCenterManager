<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Cliente - Sistema Gimnasio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4 col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registrar Nuevo Cliente</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/clientes/save}" th:object="${cliente}" method="post">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" id="nombre" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{nombre}">Error en nombre</div>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" th:field="*{apellido}" id="apellido" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{apellido}">Error en apellido</div>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" th:field="*{telefono}" id="telefono" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{telefono}">Error en teléfono</div>
                </div>

                <div class="mb-3">
                    <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                    <input type="date" th:field="*{fechaNacimiento}" id="fechaNacimiento" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{fechaNacimiento}">Error en fecha</div>
                </div>

                <div class="mb-3">
                    <label for="entrenador" class="form-label">Asignar Entrenador</label>
                    <select th:field="*{entrenador.id}" id="entrenador" class="form-select">
                        <option value="">-- Sin Entrenador --</option>
                        <option th:each="e : ${entrenadores}" th:value="${e.id}" th:text="${e.nombre + ' ' + e.apellido}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
