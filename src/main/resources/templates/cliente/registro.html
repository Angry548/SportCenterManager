<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Crear cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

    <link rel="stylesheet"
          th:href="@{/css/registro.css}">

</head>

<body class="register-page">

<div class="register-container">

    <div class="register-card">

        <div class="register-header">

            <div class="register-icon">
                <i class="bi bi-person-plus"></i>
            </div>

            <div>

                <span class="register-eyebrow">
                    SISTEMA GIMNASIO
                </span>

                <h1>
                    Crear cuenta
                </h1>

                <p>
                    Registra tus datos para comenzar a utilizar el gimnasio.
                </p>

            </div>

        </div>


        <form th:action="@{/registro}"
              th:object="${registro}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <div class="row g-3">


                <!-- NOMBRES -->

                <div class="col-md-6">

                    <label class="form-label">
                        Nombres
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{nombres}"
                           placeholder="Tus nombres">

                    <div class="text-danger small mt-1"
                         th:errors="*{nombres}">
                    </div>

                </div>


                <!-- APELLIDOS -->

                <div class="col-md-6">

                    <label class="form-label">
                        Apellidos
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{apellidos}"
                           placeholder="Tus apellidos">

                    <div class="text-danger small mt-1"
                         th:errors="*{apellidos}">
                    </div>

                </div>


                <!-- DUI -->

                <div class="col-md-6">

                    <label class="form-label">
                        DUI
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{dui}"
                           placeholder="00000000-0">

                    <div class="text-danger small mt-1"
                         th:errors="*{dui}">
                    </div>

                </div>


                <!-- FECHA NACIMIENTO -->

                <div class="col-md-6">

                    <label class="form-label">
                        Fecha de nacimiento
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{fechaNacimiento}">

                    <div class="text-danger small mt-1"
                         th:errors="*{fechaNacimiento}">
                    </div>

                </div>


                <!-- SEXO -->

                <div class="col-md-6">

                    <label class="form-label">
                        Sexo
                    </label>

                    <select class="form-select"
                            th:field="*{sexo}">

                        <option value="">
                            Selecciona una opción
                        </option>

                        <option th:each="sexo : ${sexos}"
                                th:value="${sexo}"
                                th:text="${sexo}">
                        </option>

                    </select>

                    <div class="text-danger small mt-1"
                         th:errors="*{sexo}">
                    </div>

                </div>


                <!-- TELÉFONO -->

                <div class="col-md-6">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{telefono}"
                           placeholder="0000-0000">

                    <div class="text-danger small mt-1"
                         th:errors="*{telefono}">
                    </div>

                </div>


                <!-- CORREO -->

                <div class="col-12">

                    <label class="form-label">
                        Correo electrónico
                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="correo@ejemplo.com">

                    <div class="text-danger small mt-1"
                         th:errors="*{email}">
                    </div>

                </div>


                <!-- DIRECCIÓN -->

                <div class="col-12">

                    <label class="form-label">
                        Dirección
                    </label>

                    <textarea class="form-control"
                              th:field="*{direccion}"
                              rows="3"
                              placeholder="Dirección de residencia">
                    </textarea>

                    <div class="text-danger small mt-1"
                         th:errors="*{direccion}">
                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="col-12">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           class="form-control"
                           th:field="*{password}"
                           placeholder="Mínimo 6 caracteres">

                    <div class="text-danger small mt-1"
                         th:errors="*{password}">
                    </div>

                </div>

            </div>


            <button type="submit"
                    class="btn btn-primary w-100 mt-4">

                <i class="bi bi-person-check me-1"></i>
                Crear mi cuenta

            </button>


            <div class="register-login">

                ¿Ya tienes una cuenta?

                <a th:href="@{/usuarios/login}">
                    Iniciar sesión
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
