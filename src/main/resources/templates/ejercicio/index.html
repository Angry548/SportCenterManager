<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Listado de Ejercicios</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">

    <!-- Mensajes de notificación -->
    <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Listado de Ejercicios</h4>
            <a th:href="@{/ejercicios/create}" class="btn btn-light btn-sm">
                <i class="bi bi-plus-circle"></i> Nuevo Ejercicio
            </a>
        </div>
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Grupo Muscular</th>
                        <th>Dificultad</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ejercicio : ${ejercicios}">
                        <td th:text="${ejercicio.id}">1</td>
                        <td>
                            <img th:if="${ejercicio.imagenUrl != null and !ejercicio.imagenUrl.empty}"
                                 th:src="${ejercicio.imagenUrl}"
                                 alt="Ejercicio"
                                 class="rounded border"
                                 style="width: 50px; height: 50px; object-fit: cover;" />
                            <span th:if="${ejercicio.imagenUrl == null or ejercicio.imagenUrl.empty}" class="text-muted fs-7">Sin imagen</span>
                        </td>
                        <td th:text="${ejercicio.nombre}" class="fw-bold">Nombre Ejercicio</td>
                        <td th:text="${ejercicio.grupoMuscular != null ? ejercicio.grupoMuscular.nombre : 'Sin asignar'}">Grupo Muscular</td>
                        <td>
                            <span th:text="${ejercicio.dificultad}" class="badge bg-secondary">DIFICULTAD</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/ejercicios/details/{id}(id=${ejercicio.id})}"
                                   class="btn btn-info text-white"
                                   title="Ver Detalles">
                                    Detalles
                                </a>
                                <a th:href="@{/ejercicios/edit/{id}(id=${ejercicio.id})}"
                                   class="btn btn-warning"
                                   title="Editar">
                                    Editar
                                </a>
                                <a th:href="@{/ejercicios/remove/{id}(id=${ejercicio.id})}"
                                   class="btn btn-danger"
                                   title="Eliminar">
                                    Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${ejercicios.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No se encontraron ejercicios registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav th:if="${pageNumbers != null and !pageNumbers.empty}" aria-label="Navegación de páginas" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${ejercicios.number == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/ejercicios(page=${ejercicios.number}, size=${ejercicios.size})}">
                            Anterior
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="pageNumber : ${pageNumbers}"
                        th:classappend="${pageNumber == ejercicios.number + 1} ? 'active'">
                        <a class="page-link"
                           th:href="@{/ejercicios(page=${pageNumber}, size=${ejercicios.size})}"
                           th:text="${pageNumber}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${ejercicios.number + 1 == ejercicios.totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/ejercicios(page=${ejercicios.number + 2}, size=${ejercicios.size})}">
                            Siguiente
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>
</body>
</html>
