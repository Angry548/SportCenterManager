<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario - Sistema Gimnasio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4 col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Crear Nuevo Usuario</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/usuarios/save}" th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" th:field="*{nombre}" id="nombre" class="form-class form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{nombre}">Error de nombre</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" th:field="*{email}" id="email" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}">Error de correo</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" th:field="*{password}" id="password" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{password}">Error de contraseña</div>
                </div>

                <div class="mb-3">
                    <label for="rol" class="form-label">Rol del Usuario</label>
                    <select th:field="*{rol.id}" id="rol" class="form-select">
                        <option value="">-- Seleccione un Rol --</option>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
                    </select>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activo" checked>
                    <label class="form-check-label" for="activo">Usuario Activo</label>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
