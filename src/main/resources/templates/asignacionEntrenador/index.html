<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Asignaciones de Entrenador</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">

    <!-- Mensajes de notificación -->
    <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Asignaciones de Entrenadores</h4>
            <a th:href="@{/asignaciones-entrenador/create}" class="btn btn-light btn-sm">
                <i class="bi bi-plus-circle"></i> Nueva Asignación
            </a>
        </div>
        <div class="card-body">

            <!-- Tabla de Asignaciones -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Entrenador</th>
                        <th>Fecha Asignación</th>
                        <th>Fecha Fin</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="asignacion : ${asignaciones}">
                        <td th:text="${asignacion.id}">1</td>
                        <td th:text="${asignacion.cliente != null ? asignacion.cliente.nombre : 'Cliente #' + asignacion.cliente.id}">Cliente</td>
                        <td th:text="${asignacion.entrenador != null and asignacion.entrenador.usuario != null ? asignacion.entrenador.usuario.nombre : 'Entrenador #' + asignacion.entrenador.id}">Entrenador</td>
                        <td th:text="${#temporals.format(asignacion.fechaAsignacion, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${asignacion.fechaFin != null ? #temporals.format(asignacion.fechaFin, 'dd/MM/yyyy') : '-'}">-</td>
                        <td>
                            <span th:if="${asignacion.fechaFin == null}" class="badge bg-success">Activa</span>
                            <span th:if="${asignacion.fechaFin != null}" class="badge bg-secondary">Finalizada</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/asignaciones-entrenador/details/{id}(id=${asignacion.id})}"
                                   class="btn btn-info text-white"
                                   title="Ver Detalles">
                                    Detalles
                                </a>
                                <a th:href="@{/asignaciones-entrenador/edit/{id}(id=${asignacion.id})}"
                                   class="btn btn-warning"
                                   title="Editar">
                                    Editar
                                </a>
                                <a th:if="${asignacion.fechaFin == null}"
                                   th:href="@{/asignaciones-entrenador/finalizar/{id}(id=${asignacion.id})}"
                                   class="btn btn-dark"
                                   title="Finalizar Asignación"
                                   onclick="return confirm('¿Desea finalizar esta asignación?');">
                                    Finalizar
                                </a>
                                <a th:href="@{/asignaciones-entrenador/remove/{id}(id=${asignacion.id})}"
                                   class="btn btn-danger"
                                   title="Eliminar">
                                    Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${asignaciones.empty}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No se encontraron asignaciones de entrenadores registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav th:if="${pageNumbers != null and !pageNumbers.empty}" aria-label="Navegación de páginas" class="mt-3">
                <ul class="pagination justify-content-center">

                    <!-- Botón Anterior -->
                    <li class="page-item" th:classappend="${asignaciones.number == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/asignaciones-entrenador(page=${asignaciones.number}, size=${asignaciones.size})}">
                            Anterior
                        </a>
                    </li>

                    <!-- Números de Página -->
                    <li class="page-item"
                        th:each="pageNumber : ${pageNumbers}"
                        th:classappend="${pageNumber == asignaciones.number + 1} ? 'active'">
                        <a class="page-link"
                           th:href="@{/asignaciones-entrenador(page=${pageNumber}, size=${asignaciones.size})}"
                           th:text="${pageNumber}">1</a>
                    </li>

                    <!-- Botón Siguiente -->
                    <li class="page-item" th:classappend="${asignaciones.number + 1 == asignaciones.totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/asignaciones-entrenador(page=${asignaciones.number + 2}, size=${asignaciones.size})}">
                            Siguiente
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>
</div>
</body>
</html>
