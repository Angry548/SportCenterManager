<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Editar Evaluación Física</h1>

    <form th:action="@{/evaluaciones-fisicas/save}"
          th:object="${evaluacionFisica}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label class="form-label">Cliente</label>

            <select class="form-select"
                    th:field="*{cliente.id}">

                <option value="">Seleccione un cliente</option>

                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.usuario.email}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('cliente')}"
                 th:errors="*{cliente}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Entrenador</label>

            <select class="form-select"
                    th:field="*{entrenador.id}">

                <option value="">Seleccione un entrenador</option>

                <option th:each="entrenador : ${entrenadores}"
                        th:value="${entrenador.id}"
                        th:text="${entrenador.usuario.email}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('entrenador')}"
                 th:errors="*{entrenador}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Fecha</label>

            <input type="date"
                   class="form-control"
                   th:field="*{fecha}">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('fecha')}"
                 th:errors="*{fecha}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Peso (kg)</label>

            <input type="number"
                   step="0.01"
                   class="form-control"
                   th:field="*{peso}">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('peso')}"
                 th:errors="*{peso}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Estatura (m)</label>

            <input type="number"
                   step="0.01"
                   class="form-control"
                   th:field="*{estatura}">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('estatura')}"
                 th:errors="*{estatura}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Porcentaje de grasa</label>

            <input type="number"
                   step="0.01"
                   class="form-control"
                   th:field="*{porcentajeGrasa}">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('porcentajeGrasa')}"
                 th:errors="*{porcentajeGrasa}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">Observaciones</label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{observaciones}">
            </textarea>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('observaciones')}"
                 th:errors="*{observaciones}">
            </div>

        </div>

        <button type="submit"
                class="btn btn-outline-success">
            Guardar cambios
        </button>

        <a th:href="@{/evaluaciones-fisicas}"
           class="btn btn-outline-secondary">
            Regresar
        </a>

    </form>

</div>
