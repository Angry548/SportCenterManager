<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <!-- Mostrar mensaje de confirmación en caso de éxito -->
    <div th:if="${msg != null}">
        <script>
            Swal.fire({
                title: "Confirmación",
                text: '[[${msg}]]',
                icon: "success"
            });
        </script>
    </div>

    <!-- Mostrar mensaje de error -->
    <div th:if="${error != null}">
        <script>
            Swal.fire({
                title: "Error",
                text: '[[${error}]]',
                icon: "error"
            });
        </script>
    </div>

    <h1>Listado de Evaluaciones Físicas</h1>

    <a th:href="@{/evaluaciones-fisicas/create}"
       class="btn btn-outline-primary">
        Nueva evaluación
    </a>

    <table class="table table-striped">

        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Entrenador</th>
            <th>Fecha</th>
            <th>Peso</th>
            <th>Estatura</th>
            <th>% Grasa</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="item : ${evaluaciones}">

            <td th:text="${item.id}"></td>

            <td th:text="${item.cliente.usuario.email}"></td>

            <td th:text="${item.entrenador.usuario.email}"></td>

            <td th:text="${item.fecha}"></td>

            <td th:text="${item.peso}"></td>

            <td th:text="${item.estatura}"></td>

            <td th:text="${item.porcentajeGrasa}"></td>

            <td>

                <a th:href="@{/evaluaciones-fisicas/details/{id}(id=${item.id})}"
                   class="btn btn-outline-secondary">
                    Detalles
                </a>

                |

                <a th:href="@{/evaluaciones-fisicas/edit/{id}(id=${item.id})}"
                   class="btn btn-outline-info">
                    Editar
                </a>

                |

                <a th:href="@{/evaluaciones-fisicas/remove/{id}(id=${item.id})}"
                   class="btn btn-outline-danger">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <!-- Paginación -->
    <nav aria-label="Page navigation">
        <ul class="pagination">

            <li class="page-item"
                th:each="pageNumber : ${pageNumbers}">

                <a class="page-link"
                   th:href="@{|/evaluaciones-fisicas?page=${pageNumber}|}"
                   th:text="${pageNumber}">
                </a>

            </li>

        </ul>
    </nav>

</div>
