<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header class="app-topbar"
        th:fragment="topbar">


    <div class="topbar-left">

        <!-- BOTÓN MÓVIL -->

        <button type="button"
                class="topbar-menu-button"
                id="sidebarOpen"
                aria-label="Abrir menú">

            <i class="bi bi-list"></i>

        </button>


        <!-- CONTEXTO DEL SISTEMA -->

        <div class="topbar-brand-context">

            <span>
                Sistema de gestión
            </span>

            <strong>
                GymSystem
            </strong>

        </div>

    </div>


    <div class="topbar-right">


        <!-- NOTIFICACIONES -->

        <button type="button"
                class="topbar-icon-button"
                aria-label="Notificaciones">

            <i class="bi bi-bell"></i>

        </button>


        <div class="topbar-separator"></div>


        <!-- USUARIO AUTENTICADO -->

        <div class="topbar-user">


            <!-- =============================================
                 AVATAR SEGÚN ROL
                 ============================================= -->

            <div class="topbar-user-avatar">

                <span sec:authorize="hasAuthority('ADMIN')">
                    AD
                </span>

                <span sec:authorize="hasAuthority('ENTRENADOR')">
                    EN
                </span>

                <span sec:authorize="hasAuthority('CLIENTE')">
                    CL
                </span>

            </div>


            <!-- =============================================
                 INFORMACIÓN SEGÚN ROL
                 ============================================= -->

            <div class="topbar-user-info">


                <!-- ADMIN -->

                <strong sec:authorize="hasAuthority('ADMIN')">
                    Administrador
                </strong>


                <!-- ENTRENADOR -->

                <strong sec:authorize="hasAuthority('ENTRENADOR')">
                    Entrenador
                </strong>


                <!-- CLIENTE -->

                <strong sec:authorize="hasAuthority('CLIENTE')">
                    Cliente
                </strong>


                <!-- EMAIL DEL USUARIO AUTENTICADO -->

                <span sec:authentication="name">
                    usuario@email.com
                </span>

            </div>

        </div>

    </div>

</header>

</body>
</html>
