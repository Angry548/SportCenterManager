<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Ejercicio en Rutina</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Detalles de la Configuración</h4>
            <div>
                <a th:href="@{/rutina-ejercicios/edit/{id}(id=${rutinaEjercicio.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/rutina-ejercicios}" class="btn btn-light btn-sm">Volver</a>
            </div>
        </div>
        <div class="card-body">

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">ID Registro:</label>
                    <p class="fs-5" th:text="${rutinaEjercicio.id}">1</p>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">Rutina:</label>
                    <p class="fs-5 text-primary fw-bold" th:text="${rutinaEjercicio.rutina != null ? rutinaEjercicio.rutina.nombre : 'Sin asignar'}">Rutina</p>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">Ejercicio:</label>
                    <p class="fs-5 text-success fw-bold" th:text="${rutinaEjercicio.ejercicio != null ? rutinaEjercicio.ejercicio.nombre : 'Sin asignar'}">Ejercicio</p>
                </div>
            </div>

            <hr/>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">Series:</label>
                    <p class="fs-4 fw-bold" th:text="${rutinaEjercicio.series}">4</p>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">Repeticiones:</label>
                    <p class="fs-4 fw-bold" th:text="${rutinaEjercicio.repeticiones}">12</p>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">Tiempo de Descanso:</label>
                    <p class="fs-4"><span class="badge bg-secondary" th:text="${rutinaEjercicio.descansoSegundos + ' Segundos'}">60 Segundos</span></p>
                </div>

                <div class="col-12 mb-3">
                    <label class="fw-bold text-muted">Observaciones / Indicaciones:</label>
                    <div class="p-3 border rounded bg-light">
                        <p class="mb-0" th:text="${rutinaEjercicio.observaciones != null and !rutinaEjercicio.observaciones.empty ? rutinaEjercicio.observaciones : 'Sin observaciones registradas.'}">Observaciones...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
