<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Ejercicio de Rutina</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">

    <div class="card border-danger shadow">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Confirmar Eliminación</h4>
        </div>
        <div class="card-body">

            <div class="alert alert-warning" role="alert">
                <strong>¡Atención!</strong> ¿Está seguro de que desea eliminar esta asignación de ejercicio de la rutina? Esta acción no se puede deshacer.
            </div>

            <div class="row my-4">
                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">ID:</label>
                    <p class="fs-5" th:text="${rutinaEjercicio.id}">1</p>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">Rutina:</label>
                    <p class="fs-5" th:text="${rutinaEjercicio.rutina != null ? rutinaEjercicio.rutina.nombre : 'Sin asignación'}">Rutina</p>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold text-muted">Ejercicio:</label>
                    <p class="fs-5" th:text="${rutinaEjercicio.ejercicio != null ? rutinaEjercicio.ejercicio.nombre : 'Sin asignación'}">Ejercicio</p>
                </div>
            </div>

            <form th:action="@{/rutina-ejercicios/delete}" method="post">
                <input type="hidden" name="id" th:value="${rutinaEjercicio.id}" />

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/rutina-ejercicios}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Confirmar y Eliminar</button>
                </div>
            </form>

        </div>
    </div>

</div>
</body>
</html>
