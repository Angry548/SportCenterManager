<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">

<head>

    <title>Cambiar contraseña</title>

    <th:block layout:fragment="styles">
        <link rel="stylesheet"
              th:href="@{/css/usuario.css}">
    </th:block>

</head>

<body>

<div layout:fragment="content">

    <nav class="user-breadcrumb">

        <a th:href="@{/usuarios}">
            Usuarios
        </a>

        <i class="bi bi-chevron-right"></i>

        <a th:href="@{/usuarios/details/{id}(id=${usuario.id})}"
           th:text="${usuario.email}">
        </a>

        <i class="bi bi-chevron-right"></i>

        <span>
            Cambiar contraseña
        </span>

    </nav>


    <div class="page-header">

        <div>

            <h1 class="page-title">
                Cambiar contraseña
            </h1>

            <p class="page-description">
                Establece una nueva contraseña para
                la cuenta seleccionada.
            </p>

        </div>

    </div>


    <div class="user-password-container">

        <form th:action="@{/usuarios/change-password}"
              method="post"
              id="changePasswordForm">

            <input type="hidden"
                   name="id"
                   th:value="${usuario.id}">


            <div class="app-card">

                <div class="app-card-header">

                    <div>

                        <h2 class="app-card-title">
                            Seguridad de la cuenta
                        </h2>

                        <div class="app-card-subtitle"
                             th:text="${usuario.email}">
                        </div>

                    </div>

                    <div class="user-section-icon">
                        <i class="bi bi-key"></i>
                    </div>

                </div>


                <div class="app-card-body">

                    <div class="user-password-account">

                        <div class="user-password-account-icon">
                            <i class="bi bi-person"></i>
                        </div>

                        <div>

                            <span>
                                Cambiando contraseña de
                            </span>

                            <strong th:text="${usuario.email}">
                            </strong>

                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="form-label"
                               for="newPassword">

                            Nueva contraseña

                        </label>

                        <div class="user-password-wrapper">

                            <i class="bi bi-lock"></i>

                            <input type="password"
                                   id="newPassword"
                                   name="newPassword"
                                   class="form-control"
                                   required
                                   autocomplete="new-password"
                                   placeholder="Ingrese la nueva contraseña">

                            <button type="button"
                                    class="user-password-toggle"
                                    data-password-toggle="newPassword"
                                    aria-label="Mostrar contraseña">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>


                    <div>

                        <label class="form-label"
                               for="confirmPassword">

                            Confirmar contraseña

                        </label>

                        <div class="user-password-wrapper">

                            <i class="bi bi-lock-fill"></i>

                            <input type="password"
                                   id="confirmPassword"
                                   class="form-control"
                                   required
                                   autocomplete="new-password"
                                   placeholder="Repita la nueva contraseña">

                            <button type="button"
                                    class="user-password-toggle"
                                    data-password-toggle="confirmPassword"
                                    aria-label="Mostrar contraseña">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                        <div id="passwordMatchError"
                             class="user-password-error"
                             hidden>

                            Las contraseñas no coinciden.

                        </div>

                    </div>

                </div>


                <div class="user-form-footer">

                    <a th:href="@{/usuarios/details/{id}(id=${usuario.id})}"
                       class="btn btn-light">

                        Cancelar

                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-key me-1"></i>
                        Actualizar contraseña

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<th:block layout:fragment="scripts">
    <script th:src="@{/js/usuario.js}"></script>
</th:block>

</body>
</html>
