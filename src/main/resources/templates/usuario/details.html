<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Usuario - Sistema Gimnasio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4 col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Detalles del Usuario</h4>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item"><strong>ID:</strong> <span th:text="${usuario.id}"></span></li>
                <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></li>
                <li class="list-group-item"><strong>Email:</strong> <span th:text="${usuario.email}"></span></li>
                <li class="list-group-item"><strong>Rol:</strong> <span th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin Rol'}"></span></li>
                <li class="list-group-item"><strong>Estado:</strong>
                    <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                    <span th:unless="${usuario.activo}" class="badge bg-danger">Inactivo</span>
                </li>
            </ul>

            <div class="d-flex justify-content-between">
                <a th:href="@{/usuarios}" class="btn btn-secondary">Volver al Listado</a>
                <div>
                    <a th:href="@{/usuarios/change-password/{id}(id=${usuario.id})}" class="btn btn-outline-primary">Cambiar Contraseña</a>
                    <a th:href="@{/usuarios/edit/{id}(id=${usuario.id})}" class="btn btn-warning">Editar</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
