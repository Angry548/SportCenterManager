<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Lista de Ejercicios por Rutina</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">

    <!-- Mensajes de feedback -->
    <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Ejercicios por Rutina</h4>
            <a th:href="@{/rutina-ejercicios/create}" class="btn btn-light btn-sm">
                Asignar Ejercicio a Rutina
            </a>
        </div>
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Rutina</th>
                        <th>Ejercicio</th>
                        <th>Series</th>
                        <th>Repeticiones</th>
                        <th>Descanso</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${rutinaEjercicios}">
                        <td th:text="${item.id}">1</td>
                        <td th:text="${item.rutina != null ? item.rutina.nombre : 'Sin Rutina'}" class="fw-bold">Rutina</td>
                        <td th:text="${item.ejercicio != null ? item.ejercicio.nombre : 'Sin Ejercicio'}">Ejercicio</td>
                        <td th:text="${item.series}">4</td>
                        <td th:text="${item.repeticiones}">12</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${item.descansoSegundos + ' seg'}">60 seg</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/rutina-ejercicios/details/{id}(id=${item.id})}"
                                   class="btn btn-info text-white">Detalles</a>
                                <a th:href="@{/rutina-ejercicios/edit/{id}(id=${item.id})}"
                                   class="btn btn-warning">Editar</a>
                                <a th:href="@{/rutina-ejercicios/remove/{id}(id=${item.id})}"
                                   class="btn btn-danger">Eliminar</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${rutinaEjercicios.empty}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No hay asignaciones de ejercicios registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav th:if="${pageNumbers != null and !pageNumbers.empty}" aria-label="Paginación" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${rutinaEjercicios.number == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/rutina-ejercicios(page=${rutinaEjercicios.number}, size=${rutinaEjercicios.size})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="pageNumber : ${pageNumbers}"
                        th:classappend="${pageNumber == rutinaEjercicios.number + 1} ? 'active'">
                        <a class="page-link" th:href="@{/rutina-ejercicios(page=${pageNumber}, size=${rutinaEjercicios.size})}" th:text="${pageNumber}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${rutinaEjercicios.number + 1 == rutinaEjercicios.totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/rutina-ejercicios(page=${rutinaEjercicios.number + 2}, size=${rutinaEjercicios.size})}">Siguiente</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>
</body>
</html>
