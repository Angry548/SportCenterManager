<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Eliminar Membresía de Cliente</h1>

    <div class="alert alert-warning">
        ¿Está seguro de que desea eliminar esta membresía?
    </div>

    <form th:action="@{/membresias-clientes/delete}"
          th:object="${membresiaCliente}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text"
                   class="form-control"
                   th:value="${membresiaCliente.id}"
                   readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <input type="text"
                   class="form-control"
                   th:value="${membresiaCliente.cliente.usuario.email}"
                   readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de membresía</label>
            <input type="text"
                   class="form-control"
                   th:value="${membresiaCliente.tipoMembresia.nombre}"
                   readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de inicio</label>
            <input type="text"
                   class="form-control"
                   th:value="${membresiaCliente.fechaInicio}"
                   readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de vencimiento</label>
            <input type="text"
                   class="form-control"
                   th:value="${membresiaCliente.fechaVencimiento}"
                   readonly>
        </div>

        <button type="submit"
                class="btn btn-outline-danger">
            Eliminar
        </button>

        <a th:href="@{/membresias-clientes}"
           class="btn btn-outline-secondary">
            Cancelar
        </a>

    </form>

</div>
