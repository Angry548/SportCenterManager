<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">

<head>

    <title>Eliminar rutina</title>

    <th:block layout:fragment="styles">

        <link rel="stylesheet"
              th:href="@{/css/rutina.css}">

    </th:block>

</head>


<body>

<div layout:fragment="content">


    <div class="routine-delete-container">

        <div class="app-card routine-delete-card">


            <div class="routine-delete-icon">
                <i class="bi bi-trash3"></i>
            </div>


            <h1>
                Eliminar rutina
            </h1>


            <p>

                Estás a punto de eliminar

                <strong th:text="${rutina.nombre}">
                </strong>.

                Confirma la operación antes de continuar.

            </p>


            <div class="routine-delete-summary">


                <div>

                    <span>
                        Cliente
                    </span>

                    <strong th:text="${rutina.cliente.usuario.email}">
                    </strong>

                </div>


                <div>

                    <span>
                        Entrenador
                    </span>

                    <strong th:text="${rutina.entrenador.usuario.email}">
                    </strong>

                </div>


                <div>

                    <span>
                        Fecha de creación
                    </span>

                    <strong th:text="${rutina.fechaCreacion}">
                    </strong>

                </div>


                <div>

                    <span>
                        ID de rutina
                    </span>

                    <strong th:text="${rutina.id}">
                    </strong>

                </div>

            </div>


            <form th:action="@{/rutinas/delete}"
                  method="post">

                <input type="hidden"
                       name="id"
                       th:value="${rutina.id}">


                <div class="routine-delete-actions">


                    <a th:href="@{/rutinas}"
                       class="btn btn-light">

                        Cancelar

                    </a>


                    <button type="submit"
                            class="btn btn-danger">

                        <i class="bi bi-trash3 me-1"></i>

                        Eliminar rutina

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<th:block layout:fragment="scripts">

    <script th:src="@{/js/rutina.js}"></script>

</th:block>

</body>
</html>
