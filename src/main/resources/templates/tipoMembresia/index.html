<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tipos de Membresía - Sistema Gimnasio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Catálogo de Tipos de Membresía</h2>
        <a th:href="@{/tipos-membresia/create}" class="btn btn-primary">Nuevo Plan</a>
    </div>

    <!-- Mensajes de notificación -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre del Plan</th>
            <th>Duración (Días)</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tipo : ${tiposMembresia.content}">
            <td th:text="${tipo.id}">1</td>
            <td th:text="${tipo.nombre}">Anual VIP</td>
            <td th:text="${tipo.duracionDias}">365</td>
            <td th:text="${'$' + #numbers.formatDecimal(tipo.precio, 1, 2)}">$120.00</td>
            <td>
                <span th:if="${tipo.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${tipo.activo}" class="badge bg-danger">Inactivo</span>
            </td>
            <td class="d-flex gap-1">
                <a th:href="@{/tipos-membresia/details/{id}(id=${tipo.id})}" class="btn btn-info btn-sm text-white">Detalles</a>
                <a th:href="@{/tipos-membresia/edit/{id}(id=${tipo.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/tipos-membresia/remove/{id}(id=${tipo.id})}" class="btn btn-danger btn-sm">Eliminar</a>

                <!-- Botón rápido Activar / Desactivar -->
                <form th:if="${tipo.activo}" th:action="@{/tipos-membresia/deactivate/{id}(id=${tipo.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Desactivar</button>
                </form>
                <form th:unless="${tipo.activo}" th:action="@{/tipos-membresia/activate/{id}(id=${tipo.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-success btn-sm">Activar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tiposMembresia.content)}">
            <td colspan="6" class="text-center">No hay tipos de membresía registrados.</td>
        </tr>
        </tbody>
    </table>

    <!-- Paginación -->
    <nav th:if="${pageNumbers}" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${tiposMembresia.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/tipos-membresia(page=${tiposMembresia.number})}">Anterior</a>
            </li>
            <li class="page-item" th:each="pageNumber : ${pageNumbers}"
                th:classappend="${pageNumber == tiposMembresia.number + 1} ? 'active'">
                <a class="page-link" th:href="@{/tipos-membresia(page=${pageNumber})}" th:text="${pageNumber}">1</a>
            </li>
            <li class="page-item" th:classappend="${tiposMembresia.number + 1 == tiposMembresia.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/tipos-membresia(page=${tiposMembresia.number + 2})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
