<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Tipo de Membresía - Sistema Gimnasio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4 col-md-6">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Confirmar Eliminación</h4>
        </div>
        <div class="card-body">
            <p class="fs-5">¿Estás seguro de que deseas eliminar permanentemente este tipo de membresía?</p>

            <div class="alert alert-secondary">
                <p class="mb-1"><strong>ID:</strong> <span th:text="${tipoMembresia.id}"></span></p>
                <p class="mb-1"><strong>Nombre del Plan:</strong> <span th:text="${tipoMembresia.nombre}"></span></p>
                <p class="mb-0"><strong>Precio:</strong> <span th:text="${'$' + #numbers.formatDecimal(tipoMembresia.precio, 1, 2)}"></span></p>
            </div>

            <form th:action="@{/tipos-membresia/delete}" th:object="${tipoMembresia}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="d-flex justify-content-between">
                    <a th:href="@{/tipos-membresia}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
