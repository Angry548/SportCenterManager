<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Tipo de Membresía - Sistema Gimnasio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4 col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Detalles del Plan</h4>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item"><strong>ID:</strong> <span th:text="${tipoMembresia.id}"></span></li>
                <li class="list-group-item"><strong>Nombre del Plan:</strong> <span th:text="${tipoMembresia.nombre}"></span></li>
                <li class="list-group-item"><strong>Duración:</strong> <span th:text="${tipoMembresia.duracionDias + ' días'}"></span></li>
                <li class="list-group-item"><strong>Precio:</strong> <span th:text="${'$' + #numbers.formatDecimal(tipoMembresia.precio, 1, 2)}"></span></li>
                <li class="list-group-item"><strong>Estado:</strong>
                    <span th:if="${tipoMembresia.activo}" class="badge bg-success">Activo</span>
                    <span th:unless="${tipoMembresia.activo}" class="badge bg-danger">Inactivo</span>
                </li>

                <!-- Cálculo proyectado de vencimiento asignando la fecha de hoy -->
                <li class="list-group-item bg-light">
                    <strong>Vencimiento Proyectado (Iniciando hoy):</strong>
                    <span class="badge bg-primary fs-6" th:text="${#temporals.format(fechaVencimientoProyectada, 'dd/MM/yyyy')}"></span>
                </li>
            </ul>

            <div class="d-flex justify-content-between">
                <a th:href="@{/tipos-membresia}" class="btn btn-secondary">Volver al Listado</a>
                <a th:href="@{/tipos-membresia/edit/{id}(id=${tipoMembresia.id})}" class="btn btn-warning">Editar Plan</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
