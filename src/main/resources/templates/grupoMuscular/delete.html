<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Eliminar Grupo Muscular</h1>

    <div class="alert alert-warning">
        ¿Está seguro de que desea eliminar este grupo muscular?
    </div>

    <form th:action="@{/grupos-musculares/delete}"
          th:object="${grupoMuscular}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text"
                   class="form-control"
                   th:value="${grupoMuscular.id}"
                   readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text"
                   class="form-control"
                   th:value="${grupoMuscular.nombre}"
                   readonly>
        </div>

        <button type="submit"
                class="btn btn-outline-danger">
            Eliminar
        </button>

        <a th:href="@{/grupos-musculares}"
           class="btn btn-outline-secondary">
            Cancelar
        </a>

    </form>

</div>
