<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Lista de Entrenadores</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">

    <!-- Mensajes de notificación -->
    <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Listado de Entrenadores</h4>
            <a th:href="@{/entrenadores/create}" class="btn btn-light btn-sm">
                <i class="bi bi-plus-circle"></i> Nuevo Entrenador
            </a>
        </div>
        <div class="card-body">

            <!-- Tabla de Entrenadores -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>DUI</th>
                        <th>Especialidad</th>
                        <th>Teléfono</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="entrenador : ${entrenadores}">
                        <td th:text="${entrenador.id}">1</td>
                        <td th:text="${entrenador.usuario != null ? entrenador.usuario.nombre : 'Sin asignar'}">Nombre Usuario</td>
                        <td th:text="${entrenador.dui}">00000000-0</td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${entrenador.especialidad}">Especialidad</span>
                        </td>
                        <td th:text="${entrenador.telefono}">0000-0000</td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/entrenadores/details/{id}(id=${entrenador.id})}"
                                   class="btn btn-info text-white"
                                   title="Ver Detalles">
                                    Detalles
                                </a>
                                <a th:href="@{/entrenadores/edit/{id}(id=${entrenador.id})}"
                                   class="btn btn-warning"
                                   title="Editar">
                                    Editar
                                </a>
                                <a th:href="@{/entrenadores/remove/{id}(id=${entrenador.id})}"
                                   class="btn btn-danger"
                                   title="Eliminar">
                                    Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${entrenadores.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No se encontraron entrenadores registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav th:if="${pageNumbers != null and !pageNumbers.empty}" aria-label="Navegación de páginas" class="mt-3">
                <ul class="pagination justify-content-center">

                    <!-- Botón Anterior -->
                    <li class="page-item" th:classappend="${entrenadores.number == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/entrenadores(page=${entrenadores.number}, size=${entrenadores.size})}">
                            Anterior
                        </a>
                    </li>

                    <!-- Números de Página -->
                    <li class="page-item"
                        th:each="pageNumber : ${pageNumbers}"
                        th:classappend="${pageNumber == entrenadores.number + 1} ? 'active'">
                        <a class="page-link"
                           th:href="@{/entrenadores(page=${pageNumber}, size=${entrenadores.size})}"
                           th:text="${pageNumber}">1</a>
                    </li>

                    <!-- Botón Siguiente -->
                    <li class="page-item" th:classappend="${entrenadores.number + 1 == entrenadores.totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/entrenadores(page=${entrenadores.number + 2}, size=${entrenadores.size})}">
                            Siguiente
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>
</div>
</body>
</html>
