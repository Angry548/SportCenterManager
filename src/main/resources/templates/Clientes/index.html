<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes - Sistema Gimnasio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Clientes</h2>
        <a th:href="@{/clientes/create}" class="btn btn-primary">Nuevo Cliente</a>
    </div>

    <!-- Mensajes de feedback -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DUI / Teléfono</th>
            <th>Fecha Nacimiento</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes.content}">
            <td th:text="${cliente.id}">1</td>
            <td th:text="${cliente.nombre}">Juan</td>
            <td th:text="${cliente.apellido}">Pérez</td>
            <td th:text="${cliente.telefono}">7777-8888</td>
            <td th:text="${#temporals.format(cliente.fechaNacimiento, 'dd/MM/yyyy')}">01/01/1995</td>
            <td class="d-flex gap-1">
                <a th:href="@{/clientes/details/{id}(id=${cliente.id})}" class="btn btn-info btn-sm text-white">Detalles</a>
                <a th:href="@{/clientes/edit/{id}(id=${cliente.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/clientes/remove/{id}(id=${cliente.id})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes.content)}">
            <td colspan="6" class="text-center">No hay clientes registrados.</td>
        </tr>
        </tbody>
    </table>

    <!-- Paginación -->
    <nav th:if="${pageNumbers}" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${clientes.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/clientes(page=${clientes.number})}">Anterior</a>
            </li>
            <li class="page-item" th:each="pageNumber : ${pageNumbers}"
                th:classappend="${pageNumber == clientes.number + 1} ? 'active'">
                <a class="page-link" th:href="@{/clientes(page=${pageNumber})}" th:text="${pageNumber}">1</a>
            </li>
            <li class="page-item" th:classappend="${clientes.number + 1 == clientes.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/clientes(page=${clientes.number + 2})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
